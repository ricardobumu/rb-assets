name: Gitleaks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Obtener repositorio con todo el historial
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Instalar Gitleaks 8.30.1
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tarball="/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$tarball"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$tarball" | sha256sum -c -
          tar -xzf "$tarball" -C /tmp gitleaks
          install_dir="${RUNNER_TEMP}/bin"
          mkdir -p "$install_dir"
          install -m 0755 /tmp/gitleaks "$install_dir/gitleaks"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Buscar secretos en el árbol y en el historial
        shell: bash
        run: |
          set -euo pipefail
          gitleaks dir . --redact=100 --no-banner
          gitleaks git . --redact=100 --no-banner
